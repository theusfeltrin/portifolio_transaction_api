name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    name: Lint, Test & Build
    runs-on: ubuntu-latest

    services:
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 3s
          --health-retries 5

    strategy:
      matrix:
        node-version: [24.x]

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Configurar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Instalar dependências
        run: npm ci

      - name: Auditoria de vulnerabilidades
        run: npm audit --audit-level=high

      - name: Lint
        run: npm run lint

      - name: Checagem de tipos
        run: npm run typecheck

      - name: Testes unitários com cobertura
        run: npm test
        env:
          NODE_ENV: test
          API_KEY: ci-test-key
          REDIS_URL: redis://localhost:6379
          SUPABASE_URL: https://ci-test.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ci-test-service-role-key

      - name: Build (compilação TypeScript)
        run: npm run build

      - name: Upload relatório de cobertura
        uses: actions/upload-artifact@v4
        with:
          name: coverage-report
          path: coverage/

  docker:
    name: Build da imagem Docker
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build da imagem
        run: docker build -t transactions-api:ci .
